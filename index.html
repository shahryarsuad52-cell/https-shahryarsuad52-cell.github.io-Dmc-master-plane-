<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DMC Master Plan - Medical Admission Prep</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <!-- Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <!-- Bengali Font -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap');

        * {
            font-family: 'Hind Siliguri', sans-serif;
            user-select: none;
        }

        .glass-card {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        @keyframes pulseGlow {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 0 25px rgba(220, 38, 38, 0.5);
            }

            50% {
                transform: scale(1.08);
                box-shadow: 0 0 45px rgba(220, 38, 38, 0.8);
            }
        }

        .animate-pulse-glow {
            animation: pulseGlow 2s infinite ease-in-out;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translate(-50%, -20px);
            }

            to {
                opacity: 1;
                transform: translate(-50%, 0);
            }
        }

        .toast-animate {
            animation: fadeInDown 0.4s ease forwards;
        }

        .slide-fade {
            transition: opacity 1s ease-in-out;
        }

        /* =========================================
           BACKGROUND MUSIC PLAYER
        ========================================= */

        #music-control {
            position: fixed;
            bottom: 18px;
            right: 18px;
            z-index: 200;
        }

        .music-panel {
            background: rgba(15, 23, 42, 0.94);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.12);
            box-shadow: 0 15px 40px rgba(0,0,0,0.45);
        }

        @keyframes musicPulse {
            0%,100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.08);
            }
        }

        .music-playing {
            animation: musicPulse 1.5s infinite ease-in-out;
        }

        /* =========================================
           SCREEN 3 BACKGROUND SLIDESHOW
        ========================================= */

        .screen-bg-slideshow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .bg-slide-item {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0;
            transition: opacity 2s ease-in-out;
        }

        .bg-slide-item.active {
            opacity: 0.25;
        }

        .bg-slide-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;

            background:
                radial-gradient(
                    circle,
                    rgba(15, 23, 42, 0.6) 0%,
                    rgba(15, 23, 42, 0.95) 100%
                );

            z-index: 1;
        }
    </style>
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between relative overflow-x-hidden">

<!-- =====================================================
     BACKGROUND MUSIC
===================================================== -->

<audio
    id="bg-music"
    loop
    preload="auto"
    playsinline
>
    <source
        src="https://raw.githubusercontent.com/Anirban-Saha-001/Songs/main/Believer.mp3"
        type="audio/mpeg"
    >

    <!-- Backup -->
    <source
        src="https://cdn.pixabay.com/download/audio/2022/10/25/audio_946d1fdf3b.mp3"
        type="audio/mpeg"
    >
</audio>


<!-- =====================================================
     MUSIC CONTROL
===================================================== -->

<div id="music-control">

    <div class="music-panel rounded-2xl p-3">

        <div class="flex items-center gap-2">

            <button
                id="music-toggle"
                onclick="toggleMusic()"
                class="w-11 h-11 rounded-xl bg-red-600 hover:bg-red-500 flex items-center justify-center text-white shadow-lg transition"
            >
                <i id="music-icon" class="fa-solid fa-volume-high"></i>
            </button>

            <div class="hidden sm:block">

                <div class="text-[10px] text-slate-400">
                    MOTIVATION MUSIC
                </div>

                <div
                    id="music-status"
                    class="text-xs font-bold text-emerald-400"
                >
                    Playing • Believer
                </div>

            </div>

        </div>

    </div>

</div>


<!-- =====================================================
     FEEDBACK TOAST
===================================================== -->

<div
    id="feedback-toast"
    class="fixed top-20 left-1/2 -translate-x-1/2 z-[120] hidden px-6 py-3 rounded-2xl text-center font-bold text-xs md:text-sm shadow-2xl backdrop-blur-md border transition-all duration-300 pointer-events-none"
>
    <span id="toast-text"></span>
</div>


<!-- =====================================================
     INTRO SCREEN
===================================================== -->

<div
    id="intro-screen"
    class="fixed inset-0 bg-cover bg-center z-[100] flex flex-col items-center justify-between p-6 relative"
    style="background-image: url('dmc-gate.jpg');"
>

    <div class="absolute inset-0 bg-slate-950/80 backdrop-blur-xs"></div>

    <div class="relative z-10 text-center mt-12">

        <span
            class="bg-red-600/90 text-white text-[11px] font-bold px-3 py-1 rounded-full uppercase tracking-wider shadow-lg"
        >
            Target DMC 2026
        </span>

        <h1
            class="text-3xl md:text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-red-500 via-rose-300 to-amber-200 mt-3 drop-shadow-lg"
        >
            DMC MASTER PLAN
        </h1>

        <p
            class="text-slate-300 text-xs md:text-sm font-semibold tracking-widest uppercase mt-2 drop-shadow"
        >
            A Project by Rauha Shahryar Suad
        </p>

    </div>


    <div class="relative z-10 mb-16 text-center">

        <button
            onclick="goToPasswordScreen()"
            class="bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-500 hover:to-rose-500 text-white font-extrabold px-10 py-4 rounded-full shadow-2xl shadow-red-900/60 text-lg transition transform hover:scale-110 active:scale-95 flex items-center gap-3 mx-auto animate-pulse-glow"
        >
            <i class="fa-solid fa-play"></i>

            PLAY

        </button>

        <p class="text-[10px] text-slate-400 mt-4">
            🎵 Motivational music will start automatically
        </p>

    </div>

</div>


<!-- =====================================================
     PASSWORD SCREEN
===================================================== -->

<div
    id="password-screen"
    class="fixed inset-0 z-[90] hidden flex-col items-center justify-center p-4 bg-cover bg-center relative"
    style="background-image: url('dmc-logo.jpg');"
>

    <div class="absolute inset-0 bg-slate-950 backdrop-blur-md"></div>

    <div
        class="relative z-10 glass-card p-8 rounded-3xl max-w-md w-full text-center shadow-2xl border border-slate-700"
    >

        <div
            class="w-20 h-20 mx-auto mb-4 rounded-full border-2 border-red-500 overflow-hidden shadow-lg"
        >

            <img
                src="dmc-logo.jpg"
                alt="DMC Logo"
                class="w-full h-full object-cover"
                onError="this.src='https://via.placeholder.com/150?text=DMC'"
            >

        </div>

        <h2 class="text-xl font-bold text-slate-100 mb-1">
            পাসওয়ার্ড প্রদান করুন
        </h2>

        <p class="text-xs text-slate-400 mb-6">
            ওয়েবসাইটে এক্সেস পেতে সিক্রেট কি দিন
        </p>

        <input
            type="password"
            id="pass-input"
            placeholder="Enter password..."
            class="w-full bg-slate-900/90 border border-slate-700 rounded-xl px-4 py-3 text-center text-sm text-white focus:outline-none focus:border-red-500 mb-4 tracking-wider"
            onkeydown="if(event.key === 'Enter') checkPassword()"
        >

        <button
            onclick="checkPassword()"
            class="w-full bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-500 hover:to-rose-500 text-white font-bold py-3 rounded-xl shadow-lg transition"
        >
            আনলক করুন
        </button>

        <p
            id="pass-error"
            class="text-red-400 text-xs mt-3 hidden"
        >
            ভুল পাসওয়ার্ড! সঠিক পাসওয়ার্ড দিয়ে চেষ্টা করুন।
        </p>

    </div>

</div>

<header

    <div

        <div

            <div
                class="w-10 h-10 bg-red-600 rounded-xl flex items-center justify-center text-white text-xl shadow-lg shadow-red-900/40"

                <i class="
